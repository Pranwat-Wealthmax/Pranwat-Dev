<main class="relative h-dvh w-full overflow-hidden bg-slate-900 bg-[url('/image.png')] bg-cover bg-center">
  <div class="pointer-events-none absolute inset-0 bg-slate-950/10"></div>
  <section class="relative grid h-full w-full place-items-center overflow-y-auto p-4">
    <div class="w-full max-w-lg rounded-2xl border border-white/50 bg-gradient-to-br from-white/75 via-sky-100/55 to-cyan-300/40 p-6 shadow-2xl shadow-slate-950/20 backdrop-blur-xl sm:p-10">
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold tracking-wide text-slate-950 sm:text-3xl">
          LOGIN
        </h1>
        <p class="mt-2 text-sm font-medium text-slate-700">
          Get access to your account
        </p>
      </div>
      <div class="flex flex-col gap-5">
        <div>
          <label for="username" class="mb-1.5 block text-sm font-medium text-slate-800">Username</label>
          <input id="username" type="text" placeholder="Enter username" (input)="username = $any($event.target).value" class="w-full rounded-lg border border-slate-300 bg-white/80 px-4 py-3 text-slate-900 outline-none placeholder:text-slate-400 focus:border-sky-600 focus:ring-2 focus:ring-sky-600/30"/>
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-slate-800">Password</label>
          <div class="relative">
            <input id="password" [type]="passwordVisible ? 'text' : 'password'" placeholder="Enter password" (input)="password = $any($event.target).value" class="w-full rounded-lg border border-slate-300 bg-white/80 px-4 py-3 pr-12 text-slate-900 outline-none placeholder:text-slate-400 focus:border-sky-600 focus:ring-2 focus:ring-sky-600/30"/>
            <button type="button" class="cursor-pointer absolute inset-y-0 right-0 flex items-center px-3 text-slate-600 hover:text-slate-900" (click)="passwordVisible = !passwordVisible" [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'">
              @if (passwordVisible) {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A11 11 0 0 1 12 5c5 0 9 7 9 7a15 15 0 0 1-3 3.7M6.2 6.2C3.5 8 2 12 2 12s4 7 10 7a10 10 0 0 0 4-.8" />
                </svg>
              } @else {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>
        @if (loginError) {
          <p class="text-sm text-red-700" role="alert">{{ loginError }}</p>
        }

        <app-button
          class="block w-full"
          label="Login"
          type="button"
          (clicked)="login()"
        />
      </div>
    </div>
  </section>
</main>
