<button
  [type]="type"
  [disabled]="disabled"
  (click)="clicked.emit()"
  class="w-full cursor-pointer rounded-md bg-green-500 px-4 py-3 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
>
  {{ label }}
</button>
