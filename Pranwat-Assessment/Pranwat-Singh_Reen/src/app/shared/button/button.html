<button
  [type]="type"
  [disabled]="disabled"
  (click)="clicked.emit()"
  class=" cursor-pointer w-full rounded-md bg-gradient-to-r from-blue-400 to-blue-500 px-4 py-3 font-semibold text-white shadow-md shadow-blue-900/20 transition-colors hover:from-blue-500 hover:to-blue-600 disabled:cursor-not-allowed disabled:opacity-50"
>
  {{ label }}
</button>
