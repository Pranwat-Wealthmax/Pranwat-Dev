<div class="flex flex-col gap-1">

  <label [for]="id" class="text-sm font-medium text-slate-800">
    {{ label }}
  </label>

  <input
    [id]="id"
    [type]="type"
    [placeholder]="placeholder"
    (input)="onInput($event)"
    class="w-full rounded-none border-0 border-b border-slate-700/70 bg-transparent px-3 py-2.5 text-slate-950 outline-none transition-colors placeholder:text-slate-700/70 focus:border-indigo-700 focus:ring-0"
  />

</div>
