<div class="flex flex-col gap-2">

  <label [for]="id" class="font-medium text-gray-700">
    {{ label }}
  </label>

  <input
    [id]="id"
    [type]="type"
    [placeholder]="placeholder"
    (input)="onInput($event)"
    class="border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-400"
  />

</div>
