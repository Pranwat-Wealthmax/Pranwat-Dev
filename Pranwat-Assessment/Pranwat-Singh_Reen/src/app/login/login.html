<main class="flex min-h-screen w-full bg-slate-100">
  <aside class="relative hidden min-h-screen w-1/3 overflow-hidden bg-slate-100 md:block">
    <img src="/image.png" alt="Background Here" aria-hidden="true" class="absolute inset-0 h-full w-full object-cover"/>
  </aside>
  <section class="flex flex-1 items-center justify-center px-5 py-10 sm:px-8">
    <div class="w-full max-w-102.5 rounded-xl bg-white px-7 py-9 shadow-[0_12px_30px_rgba(30,41,59,0.08)] sm:px-8">
      <header class="mb-7 text-center">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Login</h1>
        <p class="mt-1.5 text-xs text-slate-500">Please Enter your Username and Password to get access to your account</p>
      </header>

      <form class="flex flex-col gap-5" (submit)="$event.preventDefault(); login()">
        <div class="flex flex-col gap-2">
          <label for="username" class="text-xs font-semibold text-slate-700">
            Username <span class="text-red-600" aria-hidden="true">*</span>
          </label>
          <div class="relative">
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" (input)="username = $any($event.target).value" class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 pr-10 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label for="password" class="text-xs font-semibold text-slate-700">
            Password <span class="text-red-600" aria-hidden="true">*</span>
          </label>
          <div class="relative">
            <input id="password" name="password" [type]="passwordVisible ? 'text' : 'password'" autocomplete="current-password" placeholder="Password" (input)="password = $any($event.target).value" class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 pr-10 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
            />
            <button type="button" class="absolute right-0 top-0 flex h-full items-center px-3 text-slate-500 hover:text-slate-700"
              (click)="passwordVisible = !passwordVisible"
              [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                <circle cx="12" cy="12" r="2.5" />
                @if (passwordVisible) {
                  <path d="m4 4 16 16" />
                }
              </svg>
            </button>
          </div>
        </div>

        @if (loginError) {
          <p class="-mt-2 text-sm text-red-600" role="alert">{{ loginError }}</p>
        }
        <app-button
          class="block w-full"
          label="Login"
          type="submit"
        />
      </form>
    </div>
  </section>
</main>
